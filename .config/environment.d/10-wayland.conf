# Wayland/niri session environment.
# systemd environment.d format: KEY=VALUE lines only (no shell syntax).
XDG_DATA_HOME=${HOME}/.local/share
XDG_DATA_DIRS=${XDG_DATA_HOME}:/usr/local/share:/usr/share
XDG_CONFIG_HOME=${HOME}/.config
XDG_STATE_HOME=${HOME}/.local/state
XDG_CACHE_HOME=${HOME}/.cache
XCURSOR_THEME=Banana
XCURSOR_SIZE=24
QT_QPA_PLATFORMTHEME=qt6ct
NPM_CONFIG_PREFIX="${XDG_DATA_HOME}/npm-packages"
PATH=/home/adithyaps/.local/bin:/home/adithyaps/.local/share/mise/shims:/home/adithyaps/.local/share/npm-packages/bin:/home/adithyaps/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/jvm/default/bin
XCURSOR_PATH=/home/adithyaps/.local/share/icons:/home/adithyaps/.icons:/usr/share/icons
ZED_WINDOW_DECORATIONS=server
