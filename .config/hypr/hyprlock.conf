# Hyprlock — Kanagawa
general {
    hide_cursor = true
    grace = 0
    pam_module = login
    no_fade_in = false
}

background {
    color = rgba(31, 31, 40, 1.0)
}

# Lock glyph (always visible)
label {
    text = 
    font_size = 110
    font_family = GeistMono Nerd Font
    color = rgba(220, 215, 186, 1.0)
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    size = 320, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    rounding = 12
    outer_color = rgba(126, 156, 216, 1.0)
    inner_color = rgba(31, 31, 40, 0.85)
    font_color = rgba(220, 215, 186, 1.0)
    fade_on_empty = true
    fade_timeout = 500
    placeholder_text = <span foreground="#dcd7ba">Locked</span>
    fail_color = rgba(232, 36, 36, 1.0)
    fail_text = <span foreground="#e82424">Wrong password</span>
    check_color = rgba(152, 187, 108, 1.0)
    capslock_color = rgba(230, 195, 132, 1.0)
    position = 0, -40
    halign = center
    valign = center
}
