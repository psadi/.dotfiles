<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  UI / system  -> Geist
  Code / mono  -> GeistMono Nerd Font
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Geist</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>GeistMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
