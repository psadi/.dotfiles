# foot — mirrors the old Ghostty setup (Kanagawabones, Geist Mono Medium 16)
# vim: ft=dosini sw=2 ts=2 et

[main]
font=GeistMono Nerd Font:style=Medium:size=16
dpi-aware=no
pad=10x0
initial-window-mode=maximized
title=~
# foot starts the shell before the final window size is known; the resize
# makes zsh/p10k redraw and leave duplicate prompt lines. Delay the shell
# until the window is mapped. Only affects plain `footclient` (not -e).
shell=sh -c 'sleep 0.08; exec /usr/bin/zsh'
# Select text -> clipboard (Ghostty copy-on-select behaviour).
selection-target=clipboard

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes
beam-thickness=2px

[mouse]
hide-when-typing=yes

[colors-dark]
background=1f1f28
foreground=ddd8bb

regular0=1f1f28
regular1=e46a78
regular2=98bc6d
regular3=e5c283
regular4=7eb3c9
regular5=957fb8
regular6=7eb3c9
regular7=ddd8bb

bright0=49495e
bright1=ec818c
bright2=9ec967
bright3=f1c982
bright4=7bc2df
bright5=a98fd2
bright6=7bc2df
bright7=a8a48d

selection-foreground=ddd8bb
selection-background=49473e
cursor=1f1f28 e6e0c2
urls=7eb3c9
