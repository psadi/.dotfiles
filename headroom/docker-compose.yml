services:
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: headroom-proxy
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - HEADROOM_HOST=0.0.0.0
      - HEADROOM_MODE=token
      - HEADROOM_TELEMETRY=off
      - HEADROOM_ALLOW_UNAUTHENTICATED_BIND=1
      - OPENAI_TARGET_API_URL=https://opencode.ai/zen/go/v1
      - HEADROOM_WORKSPACE_DIR=/home/nonroot/.headroom
    volumes:
      - headroom_workspace:/home/nonroot/.headroom
    restart: unless-stopped

  # Long-running MCP endpoint so clients can point at http://127.0.0.1:8788/mcp
  # instead of spawning a container per session.
  headroom-mcp:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: headroom-mcp
    depends_on:
      - headroom
    entrypoint: headroom
    command:
      - mcp
      - serve
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8788"
      - --path
      - /mcp
      - --proxy-url
      - http://headroom:8787
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      - HEADROOM_TELEMETRY=off
    # The image healthcheck probes the proxy's /readyz on 8787, which this
    # container does not serve.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  headroom_workspace:
